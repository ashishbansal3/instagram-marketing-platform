services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rozpost}
      POSTGRES_USER: ${POSTGRES_USER:-rozpost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rozpost}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rozpost} -d ${POSTGRES_DB:-rozpost}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${S3_BUCKET:-rozpost-media} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-rozpost-media}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      META_MODE: ${META_MODE:-mock}
      APP_ENV: ${APP_ENV:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rozpost}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rozpost}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rozpost}
      SPRING_DATA_REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-rozpost-media}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker-media:
    build:
      context: .
      dockerfile: apps/worker-media/Dockerfile
    env_file: .env
    environment:
      META_MODE: ${META_MODE:-mock}
      APP_ENV: ${APP_ENV:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rozpost}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rozpost}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rozpost}
      SPRING_DATA_REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-rozpost-media}
      S3_PUBLIC_BASE_URL: http://minio:9000/${S3_BUCKET:-rozpost-media}
      REMOTION_SERVICE_URL: http://remotion:3100
      API_BASE_URL: http://api:8080
      NOTIFY_API_BASE_URL: http://api:8080
    depends_on:
      - api
      - remotion
      - redis

  worker-publish:
    build:
      context: .
      dockerfile: apps/worker-publish/Dockerfile
    env_file: .env
    environment:
      META_MODE: ${META_MODE:-mock}
      APP_ENV: ${APP_ENV:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rozpost}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rozpost}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rozpost}
      SPRING_DATA_REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-rozpost-media}
      API_BASE_URL: http://api:8080
    depends_on:
      - api
      - redis

  remotion:
    build:
      context: .
      dockerfile: apps/remotion-service/Dockerfile
    env_file: .env
    environment:
      PORT: 3100
      APP_ENV: ${APP_ENV:-local}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${REMOTION_PORT:-3100}:3100"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      APP_ENV: ${APP_ENV:-local}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
