name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed .env
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Committed .env is forbidden" >&2
            exit 1
          fi
          if grep -RInE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|xox[baprs]-' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' . ; then
            echo "Possible secret material detected" >&2
            exit 1
          fi

  meta-mocks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/meta-mocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm i
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm i
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - run: npm run build

  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remotion-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm i
      - run: npm test --if-present

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew || true
      - run: ./gradlew test --no-daemon
      - name: Flyway migrations present
        run: test -f src/main/resources/db/migration/V1__core_schema.sql

  workers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [worker-media, worker-publish]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew || true
      - run: ./gradlew test --no-daemon
