name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  meta-mocks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/meta-mocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/meta-mocks/package-lock.json
      - run: npm ci || npm i
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm i
      - run: npm run lint --if-present
      - run: npm run build

  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remotion-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm i
      - run: npm run build --if-present
      - run: npm test --if-present

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew || true
      - run: ./gradlew test --no-daemon

  workers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [worker-media, worker-publish]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew || true
      - run: ./gradlew test --no-daemon
