name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed .env and demo secret defaults
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Committed .env is forbidden" >&2
            exit 1
          fi
          if grep -RInE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|xox[baprs]-' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' . ; then
            echo "Possible secret material detected" >&2
            exit 1
          fi
          # Ban local demo-* secret defaults / DEMO_* permalinks outside workflow self-reference.
          # Split pattern so this YAML line does not match itself.
          DEMO_A='demo-verify|demo-app-secret|demo-internal-token'
          DEMO_B='DEMO_ROZPOST'
          if grep -RInE "${DEMO_A}|${DEMO_B}" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github --exclude='*.md' . ; then
            echo "Forbidden demo-* secret/path defaults detected" >&2
            exit 1
          fi

  meta-mocks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/meta-mocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm i
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - run: npm run build

  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remotion-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/remotion-service/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew || true
      - run: ./gradlew test --no-daemon
      - name: Flyway migrations present
        run: |
          test -f src/main/resources/db/migration/V1__core_schema.sql
          test -f src/main/resources/db/migration/V4__approval_publish.sql

  workers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [worker-media, worker-publish]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew || true
      - run: ./gradlew test --no-daemon

  # Full META_MODE=mock dogfood: compose → webhook → media worker → assets-ready → approve → publish.
  # Runs on PRs; may take ~15–25m for JVM image builds.
  e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [secret-scan, api, workers, remotion]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local env (optional overrides; compose works without .env)
        run: |
          chmod +x scripts/bootstrap-env.sh scripts/e2e-smoke.sh
          ./scripts/bootstrap-env.sh
          grep -q 'MOCK_AUTO_ENHANCE=false' .env
          grep -q 'S3_BUCKET=rozpost-media' .env
          grep -q 'POSTGRES_DB=rozpost' .env
      - name: Compose up (pipeline services; skip web UI for API smoke)
        run: |
          set -euo pipefail
          docker compose up --build -d postgres redis minio
          # Bucket also created via MINIO_DEFAULT_BUCKETS / ObjectStorageService if mc init fails.
          docker compose up --build -d minio-init || echo "minio-init skipped/failed — relying on app bucket create"
          # --wait blocks until healthchecks pass (api + worker-media) so smoke does not race JVM boot.
          docker compose up --build -d --wait api worker-media worker-publish remotion
      - name: Wait for API health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/v1/health >/dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 5
          done
          docker compose logs api worker-media worker-publish remotion | tail -200
          exit 1
      - name: Confirm worker-media healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T worker-media curl -sf http://localhost:8081/actuator/health >/dev/null; then
              echo "worker-media ready"
              exit 0
            fi
            sleep 5
          done
          docker compose logs worker-media --no-color | tail -200
          exit 1
      - name: e2e-smoke (webhook → media → approve → publish)
        run: |
          export API_BASE_URL=http://localhost:8080
          export WEBHOOK_VERIFY_TOKEN=local-verify
          ./scripts/e2e-smoke.sh
      - name: Compose logs on failure
        if: failure()
        run: |
          echo '==== worker-media ===='
          docker compose logs worker-media --no-color | tail -250
          echo '==== api ===='
          docker compose logs api --no-color | tail -150
          echo '==== remotion ===='
          docker compose logs remotion --no-color | tail -80
          echo '==== worker-publish (excl. scheduled_for noise if any) ===='
          docker compose logs worker-publish --no-color | tail -80
      - name: Tear down
        if: always()
        run: docker compose down -v
