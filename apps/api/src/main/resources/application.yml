server:
  port: 8080

spring:
  application:
    name: rozpost-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/imp}
    username: ${SPRING_DATASOURCE_USERNAME:imp}
    password: ${SPRING_DATASOURCE_PASSWORD:imp}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

rozpost:
  meta-mode: ${META_MODE:mock}
  webhook-verify-token: ${WEBHOOK_VERIFY_TOKEN:demo-verify}
  meta-app-secret: ${META_APP_SECRET:demo-app-secret}
