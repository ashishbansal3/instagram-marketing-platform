server:
  port: 8080

spring:
  application:
    name: rozpost-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rozpost}
    username: ${SPRING_DATASOURCE_USERNAME:rozpost}
    password: ${SPRING_DATASOURCE_PASSWORD:rozpost}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [corr=%X{correlationId} tenant=%X{tenantId}]"

rozpost:
  meta-mode: ${META_MODE:mock}
  app-env: ${APP_ENV:local}
  webhook-verify-token: ${WEBHOOK_VERIFY_TOKEN:}
  meta-app-secret: ${META_APP_SECRET:}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  internal-api-token: ${INTERNAL_API_TOKEN:}
  # Live Graph token placeholder — set in host secret store; never commit real values.
  meta-graph-access-token: ${META_GRAPH_ACCESS_TOKEN:}
  meta-graph-version: ${META_GRAPH_VERSION:v21.0}
  fixture-permalink: ${FIXTURE_PERMALINK:https://www.instagram.com/p/MOCK_ROZPOST_POSTED/}
  publish-quota-per-day: ${PUBLISH_QUOTA_PER_DAY:25}
  mock-auto-enhance: ${MOCK_AUTO_ENHANCE:true}
  api-public-base-url: ${API_PUBLIC_BASE_URL:${API_BASE_URL:http://localhost:8080}}
  website:
    use-llm: ${WEBSITE_USE_LLM:false}
    job-poll-ms: ${WEBSITE_GBP_JOB_POLL_MS:1500}
  sites:
    local-root: ${SITE_LOCAL_ROOT:./data/sites}
  s3:
    bucket: ${S3_BUCKET:rozpost-media}
    region: ${S3_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:}
    force-path-style: ${S3_FORCE_PATH_STYLE:false}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  gbp:
    access-token: ${GBP_ACCESS_TOKEN:}
    account-name: ${GBP_ACCOUNT_NAME:}
    api-base: ${GBP_API_BASE:https://mybusinessbusinessinformation.googleapis.com/v1}
