server:
  port: 8080

spring:
  application:
    name: rozpost-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rozpost}
    username: ${SPRING_DATASOURCE_USERNAME:rozpost}
    password: ${SPRING_DATASOURCE_PASSWORD:rozpost}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [corr=%X{correlationId} tenant=%X{tenantId}]"

rozpost:
  meta-mode: ${META_MODE:mock}
  app-env: ${APP_ENV:local}
  webhook-verify-token: ${WEBHOOK_VERIFY_TOKEN:local-verify}
  meta-app-secret: ${META_APP_SECRET:}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  internal-api-token: ${INTERNAL_API_TOKEN:}
  fixture-permalink: ${FIXTURE_PERMALINK:https://www.instagram.com/p/MOCK_ROZPOST_POSTED/}
  mock-media-path: ${MOCK_MEDIA_PATH:fixtures/sample-salon.jpg}
  publish-quota-per-day: ${PUBLISH_QUOTA_PER_DAY:25}
  # false = enqueue real media-download/enhance jobs (compose E2E / workers).
  # true = simulation-only short-circuit to awaiting_approval (unit tests / fast stubs).
  mock-auto-enhance: ${MOCK_AUTO_ENHANCE:false}
