server:
  port: 8082

spring:
  application:
    name: rozpost-worker-publish
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rozpost}
    username: ${SPRING_DATASOURCE_USERNAME:rozpost}
    password: ${SPRING_DATASOURCE_PASSWORD:rozpost}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

logging:
  pattern:
    level: "%5p [corr=%X{correlationId}]"

rozpost:
  meta-mode: ${META_MODE:mock}
  app-env: ${APP_ENV:local}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  fixture-permalink: ${FIXTURE_PERMALINK:https://www.instagram.com/p/MOCK_ROZPOST_POSTED/}
  publish-poll-ms: ${PUBLISH_POLL_MS:1000}
  ig-container-poll-ms: ${IG_CONTAINER_POLL_MS:1500}
  ig-container-poll-max: ${IG_CONTAINER_POLL_MAX:40}

publish:
  consumer:
    enabled: true
    poll-ms: ${PUBLISH_POLL_MS:1000}
    max-attempts: ${PUBLISH_MAX_ATTEMPTS:5}
  queues:
    publish: stream.ig-publish
    delayed: stream.ig-publish-delayed
    dlq: stream.ig-publish-dlq
    publish-list: ig-publish
    delayed-list: ig-publish-delayed

resilience4j:
  circuitbreaker:
    instances:
      metaGraph:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      metaGraph:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException
          - com.rozpost.worker.publish.infrastructure.meta.GraphHttpClient$RateLimitedException
